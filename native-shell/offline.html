<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ECRN — Offline</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #0A100C; color: #fff; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: rgba(255,255,255,.65); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button {
        background: #16C172; color: #0A100C; border: 0; border-radius: 14px; font-weight: 600;
        font-size: 16px; padding: 14px 28px;
      }
    </style>
  </head>
  <body>
    <div>
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 4 L29 27 L3 27 Z" stroke="#16C172" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M16 12 L24 26 L8 26 Z" fill="#FFFFFF" />
      </svg>
      <h1>You're offline</h1>
      <p>ECRN needs an internet connection.<br />Check your signal and try again.</p>
      <button onclick="location.href='https://ecrn.aaron-9c3.workers.dev/start'">Try again</button>
    </div>
  </body>
</html>
